<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f12">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Инструменты</title>
<link rel="stylesheet" href="style.css">
<style>
/* Hub-specific layout */
body{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  overflow-x:hidden;
}

/* Ambient glows */
.glow{position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(100px);opacity:.05;pointer-events:none;z-index:0}
.glow-warm{background:var(--warm);top:-100px;right:-80px}
.glow-cool{background:var(--cool);bottom:-120px;left:-100px}

.content{position:relative;z-index:2;width:100%;max-width:680px}

/* Header */
.hub-header{text-align:center;margin-bottom:40px}
.hub-title{font-size:13px;font-weight:400;letter-spacing:5px;text-transform:uppercase;color:var(--neutral)}

/* Bento — asymmetric middle row */
.bento{display:grid;grid-template-columns:6fr 4fr;gap:8px}

/* Card base */
a.bc{
  text-decoration:none;
  border-radius:var(--radius);
  padding:20px;
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--surface);
  border:1px solid color-mix(in srgb, var(--ac) 14%, transparent);
  transition:all .2s ease;
  position:relative;
  overflow:hidden;
}
a.bc:active{transform:scale(0.97)}

/* Subtle inner glow */
a.bc::after{
  content:'';position:absolute;
  width:140px;height:140px;border-radius:50%;
  background:var(--ac);opacity:.04;
  filter:blur(60px);pointer-events:none;
  top:-40px;left:-40px;
}

/* Hero (full width) */
.bc-hero{grid-column:1/-1;padding:24px;gap:14px}
.bc-hero .bc-icon{width:44px;height:44px;border-radius:12px}
.bc-hero .bc-icon svg{width:22px;height:22px}
.bc-hero .bc-name{font-size:16px}

/* Regular cards */
.bc-reg{padding:18px 16px;gap:10px}
.bc-reg .bc-icon{width:34px;height:34px;border-radius:9px}
.bc-reg .bc-icon svg{width:17px;height:17px}

/* Bottom card (full width, between hero and reg) */
.bc-bottom{grid-column:1/-1;padding:20px;gap:12px}
.bc-bottom .bc-icon{width:38px;height:38px;border-radius:10px}
.bc-bottom .bc-icon svg{width:19px;height:19px}

/* Icon container */
.bc-icon{
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--ac) 8%, transparent);
  flex-shrink:0;
}
.bc-icon svg{
  stroke:var(--ac);stroke-width:1.5;fill:none;
  stroke-linecap:round;stroke-linejoin:round;
}

/* Text */
.bc-text{flex:1;min-width:0}
.bc-name{font-size:14px;font-weight:500;color:var(--text);letter-spacing:.1px}
.bc-desc{font-size:11px;color:var(--dim);font-weight:300;margin-top:3px;line-height:1.35}

/* Themes */
.t-cool{--ac:var(--cool)}
.t-warm{--ac:var(--warm)}
.t-neutral{--ac:var(--neutral)}
.t-study{--ac:var(--study)}

/* Entrance animation */
.hub-header,.bc,.hub-links,.hub-footer{
  animation:fadeUp .4s ease both;
}
.hub-header{animation-delay:0s}
.bento .bc:nth-child(1){animation-delay:.05s}
.bento .bc:nth-child(2){animation-delay:.1s}
.bento .bc:nth-child(3){animation-delay:.15s}
.bento .bc:nth-child(4){animation-delay:.2s}
.hub-links{animation-delay:.25s}
.hub-footer{animation-delay:.3s}

/* Paper workspace links */
.hub-links{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:16px;font-size:11px;color:var(--dim)}
.hub-links a{color:var(--dim);text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.18);padding:4px 0}
.hub-links a:hover{color:var(--text)}

/* Footer */
.hub-footer{text-align:center;margin-top:30px;font-size:10px;color:var(--neutral);letter-spacing:1.5px;font-weight:300}
</style>
</head>
<body>

<div class="glow glow-warm"></div>
<div class="glow glow-cool"></div>

<div class="content">
  <div class="hub-header">
    <div class="hub-title">инструменты</div>
  </div>

  <div class="bento">

    <!-- Hero: Workout -->
    <a class="bc bc-hero t-cool" href="workout.html">
      <div class="bc-icon" data-icon="workout"></div>
      <div class="bc-text">
        <div class="bc-name">Силовые в поездке</div>
        <div class="bc-desc">4 тренировки на коврике · турник отдельно</div>
      </div>
    </a>

    <!-- Recipes (wider — 3fr) -->
    <a class="bc bc-reg t-warm" href="recipes.html">
      <div class="bc-icon" data-icon="recipes"></div>
      <div class="bc-text">
        <div class="bc-name">Рецепты</div>
        <div class="bc-desc">20 рецептов · на русском и английском</div>
      </div>
    </a>

    <!-- Coffee (narrower — 2fr) -->
    <a class="bc bc-reg t-neutral" href="coffee.html">
      <div class="bc-icon" data-icon="coffee"></div>
      <div class="bc-text">
        <div class="bc-name">Кофе</div>
        <div class="bc-desc">Кемекс · V60 · аэропресс</div>
      </div>
    </a>

    <!-- Dutch (full width bottom) -->
    <a class="bc bc-bottom t-study" href="dutch.html">
      <div class="bc-icon" data-icon="dutch"></div>
      <div class="bc-text">
        <div class="bc-name">Нидерландский</div>
        <div class="bc-desc">Грамматика · A1→B1 · на русском и английском</div>
      </div>
    </a>

  </div>

  <div class="hub-links">
    <span>Paper 2:</span>
    <a href="intro_outline.html">план введения</a>
    <span>·</span>
    <a href="paper_map.html">карта</a>
  </div>

  <div class="hub-footer">ksrvskj.github.io</div>
</div>

<script src="icons.js"></script>
<script>
if(typeof ICONS!=='undefined'&&ICONS.hub)document.querySelectorAll('.bc-icon[data-icon]').forEach(function(el){el.innerHTML=ICONS.hub[el.dataset.icon]||'';});
</script>
</body>
</html>
