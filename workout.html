<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f12">
<meta name="description" content="Четыре силовые тренировки на коврике: ноги, отжимания, пресс и планки. Если есть турник, можно отдельно потренировать подтягивания.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Силовые в поездке</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="workout.css">
</head>
<body class="workout-page">
<a class="wo-skip" href="#workoutMain">К тренировке</a>

<header class="wo-header">
  <div class="wo-header-row">
    <div>
      <div class="wo-eyebrow">Без зала</div>
      <h1 class="wo-title">Силовые в поездке</h1>
    </div>
    <a class="wo-hub-link" href="index.html" aria-label="Вернуться на главную страницу">← На главную</a>
  </div>
  <p class="wo-subtitle">Четыре тренировки на коврике: ноги, отжимания, пресс и планки. Если есть турник, можно отдельно потренировать подтягивания.</p>
  <div class="wo-meta" role="group" aria-label="Параметры программы">
    <span class="wo-pill">2 силовые в неделю</span>
    <span class="wo-pill">15–45 минут</span>
    <span class="wo-pill">не до отказа</span>
  </div>
</header>

<nav class="wo-tabs" aria-label="Разделы тренировки">
  <a class="wo-tab-home" href="index.html" aria-label="На главную">←</a>
  <button class="wo-tab" type="button" data-view="today">Сегодня</button>
  <button class="wo-tab" type="button" data-view="a">A</button>
  <button class="wo-tab" type="button" data-view="b">B</button>
  <button class="wo-tab" type="button" data-view="core">Пресс</button>
  <button class="wo-tab" type="button" data-view="bar">Турник</button>
</nav>

<main class="wo-main" id="workoutMain" tabindex="-1">
  <noscript><div class="wo-banner wo-banner-warn">Для этой страницы нужен JavaScript.</div></noscript>
  <div id="workoutApp" aria-live="off"></div>
</main>

<section class="wo-focus" id="workoutFocus" role="dialog" aria-modal="true" hidden aria-labelledby="focusTitle"></section>
<div class="wo-toast" id="workoutToast" aria-hidden="true" hidden></div>
<div class="wo-sr-only" id="workoutAnnouncer" aria-live="polite"></div>

<script src="workout-diagrams.js"></script>
<script src="workout.js"></script>
</body>
</html>
